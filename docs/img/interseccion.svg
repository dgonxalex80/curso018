<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Intersección de los conjuntos A y B</title>
  <desc id="desc">Dos círculos superpuestos; solamente la región común está sombreada.</desc>
  <defs><clipPath id="circle-a"><circle cx="320" cy="220" r="145"/></clipPath></defs>
  <rect x="20" y="20" width="760" height="400" rx="18" fill="#F7F7F7" stroke="#2C5697" stroke-width="3"/>
  <circle cx="320" cy="220" r="145" fill="#F9CECA" fill-opacity="0.35" stroke="#C7433A" stroke-width="5"/>
  <circle cx="480" cy="220" r="145" fill="#C6EBF8" fill-opacity="0.35" stroke="#2C5697" stroke-width="5"/>
  <circle cx="480" cy="220" r="145" fill="#7A6DB2" fill-opacity="0.9" clip-path="url(#circle-a)"/>
  <text x="260" y="135" font-family="Source Sans 3, Arial, sans-serif" font-size="38" font-weight="700" fill="#243247">A</text>
  <text x="520" y="135" font-family="Source Sans 3, Arial, sans-serif" font-size="38" font-weight="700" fill="#243247">B</text>
  <text x="400" y="385" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="32" font-weight="700" fill="#2C5697">A ∩ B</text>
</svg>
